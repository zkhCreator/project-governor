name: Feature request
description: Propose a bounded capability for Project Governor.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow cannot be handled today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scope and non-goals
      description: What should this proposal explicitly not change?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and compatibility needs
      description: Identify platforms, runtimes, fixtures, rules, and evidence the change would require.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public contribution
      options:
        - label: This proposal contains no confidential or personally identifying information.
          required: true
